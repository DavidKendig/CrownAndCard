<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8">
<title>Crown &amp; Card</title>
<style>
	html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #020308; }
	/* !important beats the inline size Heaps' WebGL driver writes once at startup, so the
	   canvas keeps following the window (resizing, F11, fullscreen) instead of freezing. */
	canvas#webgl { display: block; width: 100% !important; height: 100% !important; image-rendering: pixelated; }
</style>
</head>
<body>
<!-- globalEvents: listen for keys on the whole page, so WASD works without clicking the canvas first. -->
<canvas id="webgl" globalEvents="1"></canvas>
<script src="game.js"></script>
</body>
</html>
